
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111318">
<title>メロディ吹鳴（改）</title>

<style>
:root {
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Noto Sans JP", sans-serif;
  background: #111318;
  color: #f5f5f7;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}

main {
  width: 100%;
  max-width: 620px;
}

h1 {
  margin: 0 0 8px;
  font-size: 26px;
}

.status {
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  margin-bottom: 18px;
  border: 1px solid #30323a;
  border-radius: 12px;
  background: #1b1d24;
  color: #c8c8d0;
  font-size: 13px;
}

.status-dot {
  flex: 0 0 9px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #f0b44d;
}

.status.ready .status-dot {
  background: #39d98a;
}

.status.error .status-dot {
  background: #ff6268;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.sound-button {
  min-width: 0;
  min-height: 155px;
  border: 1px solid #3a3d48;
  border-radius: 20px;
  background: #22252e;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  transition: background 80ms ease, transform 80ms ease,
    border-color 80ms ease;
  outline: none;
}

.sound-button:focus-visible {
  outline: 3px solid #83b7ff;
  outline-offset: 4px;
}

.sound-button.playing {
  background: #315fbd;
  border-color: #80adff;
  transform: scale(0.98);
}

.sound-button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.symbol {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: #343844;
  font-size: 22px;
  font-weight: 700;
}

.playing .symbol {
  background: #477bd7;
}

.name {
  font-size: 16px;
  font-weight: 650;
}

@media (max-width: 360px) {
  body {
    padding: 14px;
  }

  .buttons {
    gap: 10px;
  }

  .sound-button {
    min-height: 145px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .sound-button {
    transition: none;
  }
}
</style>
</head>

<body>
<main>
  <h1>メロディ吹鳴（改）</h1>

  <div id="status" class="status" role="status" aria-live="polite">
    <span class="status-dot"></span>
    <span id="statusText">音声を読み込み中...</span>
  </div>

  <div class="buttons">
    <button class="sound-button" id="button1" type="button" disabled>
      <span class="symbol">1</span>
      <span class="name">通勤型MH</span>
    </button>

    <button class="sound-button" id="button2" type="button" disabled>
      <span class="symbol">2</span>
      <span class="name">特急型MH</span>
    </button>

    <button class="sound-button" id="button3" type="button" disabled>
      <span class="symbol">3</span>
      <span class="name">車両連結部放送</span>
    </button>
  </div>
</main>

<script>
"use strict";

const SOUND_URLS = [
  "./sounds/horn1.mp3",
  "./sounds/horn2.mp3",
  "./sounds/horn3.mp3"
];

const REPEAT_DELAY_MS = 1500;

const buttons = [
  document.getElementById("button1"),
  document.getElementById("button2"),
  document.getElementById("button3")
];

const statusBox = document.getElementById("status");
const statusText = document.getElementById("statusText");

let audioContext = null;
let audioBuffers = [null, null, null];
let isReady = false;
let isLoading = false;

let active = null;
let priority = null;
let horn3Enabled = false;
let horn3Timer = null;
let priorityGeneration = 0;

const pointerHeld = [false, false];
const keyboardHeld = [false, false];

function setStatus(message, type = "") {
  statusText.textContent = message;
  statusBox.className = "status";
  if (type) statusBox.classList.add(type);
}

function createAudioContext() {
  if (!audioContext) {
    audioContext = new AudioContext({
      latencyHint: "interactive"
    });
  }
  return audioContext;
}

async function loadSound(url) {
  const response = await fetch(url, { cache: "force-cache" });

  if (!response.ok) {
    throw new Error(`音声を読み込めません (${response.status}): ${url}`);
  }

  const data = await response.arrayBuffer();
  return await createAudioContext().decodeAudioData(data);
}

async function initializeAudio() {
  if (isLoading || isReady) return;

  isLoading = true;
  buttons.forEach(button => button.disabled = true);
  setStatus("音声を読み込み中...");

  try {
    createAudioContext();
    audioBuffers = await Promise.all(SOUND_URLS.map(loadSound));

    isReady = true;
    buttons.forEach(button => button.disabled = false);
    setStatus("準備完了", "ready");
  } catch (error) {
    console.error(error);
    setStatus(
      "読み込み失敗。音声ファイルのURLとサーバー設定を確認してください",
      "error"
    );
  } finally {
    isLoading = false;
  }
}

function syncHorn3Display() {
  buttons[2].classList.toggle("playing", horn3Enabled);
}

function updateButton(index, playing) {
  if (index === 2) {
    syncHorn3Display();
    return;
  }

  buttons[index].classList.toggle("playing", playing);
  syncHorn3Display();
}

function clearHorn3Timer() {
  if (horn3Timer !== null) {
    clearTimeout(horn3Timer);
    horn3Timer = null;
  }
}

function stopActive() {
  if (!active) return;

  const old = active;
  active = null;

  updateButton(old.index, false);

  if (old.source) {
    old.source.onended = null;

    try {
      old.source.stop();
    } catch (_) {}

    try {
      old.source.disconnect();
      old.gain.disconnect();
    } catch (_) {}
  }
}

function playSound(index, onFinished = null) {
  if (!isReady || !audioContext) return;

  stopActive();

  const source = audioContext.createBufferSource();
  source.buffer = audioBuffers[index];
  source.loop = false;

  const gain = audioContext.createGain();
  gain.gain.value = 1.0;

  source.connect(gain);
  gain.connect(audioContext.destination);

  const record = { index, source, gain };
  active = record;
  updateButton(index, true);

  source.onended = () => {
    if (active !== record) return;

    active = null;
    updateButton(index, false);

    try {
      source.disconnect();
      gain.disconnect();
    } catch (_) {}

    if (typeof onFinished === "function") {
      onFinished();
    }
  };

  source.start(0);
}

function scheduleHorn3() {
  clearHorn3Timer();
  syncHorn3Display();

  if (!horn3Enabled || priority || active) return;

  horn3Timer = setTimeout(() => {
    horn3Timer = null;

    if (!horn3Enabled || priority || active) {
      syncHorn3Display();
      return;
    }

    playHorn3Once();
  }, REPEAT_DELAY_MS);
}

function playHorn3Once() {
  if (!horn3Enabled || priority || active) {
    syncHorn3Display();
    return;
  }

  playSound(2, () => {
    syncHorn3Display();

    if (horn3Enabled && !priority) {
      scheduleHorn3();
    }
  });

  syncHorn3Display();
}

function startHorn3() {
  horn3Enabled = true;
  syncHorn3Display();

  if (priority) return;

  clearHorn3Timer();

  if (active) stopActive();

  playHorn3Once();
}

function stopHorn3() {
  horn3Enabled = false;
  clearHorn3Timer();

  if (active && active.index === 2) {
    stopActive();
  }

  syncHorn3Display();
}

async function startPriority(index) {
  if (!isReady) return;

  clearHorn3Timer();

  const token = ++priorityGeneration;
  priority = { index, token };

  stopActive();
  syncHorn3Display();

  try {
    if (audioContext.state !== "running") {
      await audioContext.resume();
    }
  } catch (error) {
    console.error(error);
    finishPriority(token);
    return;
  }

  if (!priority || priority.token !== token) return;

  if (index === 0 && !isHorn1Held()) {
    finishPriority(token);
    return;
  }

  /*
   * 通勤型MHはループしない。
   * 押下開始時に1回だけ再生し、音声終了後は停止する。
   * 押しっぱなしでも再生し直さない。
   */
  if (index === 0) {
    playSound(0, () => {
      if (!priority || priority.token !== token) return;
      finishPriority(token);
    });
  } else {
    playSound(1, () => {
      if (!priority || priority.token !== token) return;
      finishPriority(token);
    });
  }

  syncHorn3Display();
}

function isHorn1Held() {
  return pointerHeld[0] || keyboardHeld[0];
}

function finishPriority(token) {
  if (!priority || priority.token !== token) return;

  priority = null;
  stopActive();

  updateButton(0, false);
  updateButton(1, false);
  syncHorn3Display();

  if (horn3Enabled) {
    scheduleHorn3();
  }
}

function pressHorn1() {
  if (!isReady || isHorn1Held()) return;

  pointerHeld[0] = true;
  startPriority(0);
}

function releaseHorn1() {
  pointerHeld[0] = false;
  keyboardHeld[0] = false;

  if (priority && priority.index === 0) {
    finishPriority(priority.token);
  }
}

function pressHorn2() {
  if (!isReady) return;
  startPriority(1);
}

function toggleHorn3() {
  if (!isReady) return;

  if (horn3Enabled) {
    stopHorn3();
  } else {
    startHorn3();
  }
}

/* マウス・タッチ・ペン操作：通勤型MH */
buttons[0].addEventListener("pointerdown", event => {
  event.preventDefault();

  try {
    buttons[0].setPointerCapture(event.pointerId);
  } catch (_) {}

  pressHorn1();
});

buttons[0].addEventListener("pointerup", releaseHorn1);
buttons[0].addEventListener("pointercancel", releaseHorn1);
buttons[0].addEventListener("lostpointercapture", releaseHorn1);

/* 特急型MH */
buttons[1].addEventListener("pointerdown", event => {
  event.preventDefault();

  try {
    buttons[1].setPointerCapture(event.pointerId);
  } catch (_) {}

  pressHorn2();
});

/* 車両連結部放送 */
buttons[2].addEventListener("pointerdown", event => {
  event.preventDefault();

  try {
    buttons[2].setPointerCapture(event.pointerId);
  } catch (_) {}

  toggleHorn3();
});

/* キーボード操作：通勤型MH */
buttons[0].addEventListener("keydown", event => {
  if (event.code !== "Space" && event.code !== "Enter") return;

  event.preventDefault();
  if (event.repeat) return;

  keyboardHeld[0] = true;
  startPriority(0);
});

buttons[0].addEventListener("keyup", event => {
  if (event.code !== "Space" && event.code !== "Enter") return;

  event.preventDefault();
  releaseHorn1();
});

/* キーボード操作：特急型MH */
buttons[1].addEventListener("keydown", event => {
  if (event.code !== "Space" && event.code !== "Enter") return;

  event.preventDefault();
  if (event.repeat) return;

  pressHorn2();
});

/* キーボード操作：車両連結部放送 */
buttons[2].addEventListener("keydown", event => {
  if (event.code !== "Space" && event.code !== "Enter") return;

  event.preventDefault();
  if (event.repeat) return;

  toggleHorn3();
});

function stopAllAudio() {
  releaseHorn1();
  stopHorn3();

  if (priority) {
    finishPriority(priority.token);
  }

  stopActive();
  syncHorn3Display();
}

window.addEventListener("blur", stopAllAudio);

document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopAllAudio();
});

initializeAudio();
</script>
</body>
</html>
